

<section class="container py-5" id="offers">

    <h2 class="section-title">
        Today's Special Offers
    </h2>

    <div id="offerCarousel" class="carousel slide shadow rounded overflow-hidden"
        data-bs-ride="carousel">

        <!-- Indicators -->

        <div class="carousel-indicators">

            <button type="button"
                data-bs-target="#offerCarousel"
                data-bs-slide-to="0"
                class="active">
            </button>

            <button type="button"
                data-bs-target="#offerCarousel"
                data-bs-slide-to="1">
            </button>

            <button type="button"
                data-bs-target="#offerCarousel"
                data-bs-slide-to="2">
            </button>

        </div>

        <!-- Slides -->

        <div class="carousel-inner">

            <!-- Offer 1 -->

            <div class="carousel-item active">

                <img src="https://images.unsplash.com/photo-1504674900247-0877df9cc836?auto=format&fit=crop&w=1600&q=80"
                    class="d-block w-100 offer-img"
                    alt="Offer">

                <div class="carousel-caption">

                    <h2>🔥 Flat 50% OFF</h2>

                    <p>On your first order</p>

                    <button class="btn btn-warning">
                        Order Now
                    </button>

                </div>

            </div>

            <!-- Offer 2 -->

            <div class="carousel-item">

                <img src="https://images.unsplash.com/photo-1546069901-ba9599a7e63c?auto=format&fit=crop&w=1600&q=80"
                    class="d-block w-100 offer-img"
                    alt="Offer">

                <div class="carousel-caption">

                    <h2>🚚 Free Delivery</h2>

                    <p>On orders above ₹299</p>

                    <button class="btn btn-warning">
                        Grab Deal
                    </button>

                </div>

            </div>

            <!-- Offer 3 -->

            <div class="carousel-item">

                <img src="https://images.unsplash.com/photo-1550547660-d9450f859349?auto=format&fit=crop&w=1600&q=80"
                    class="d-block w-100 offer-img"
                    alt="Offer">

                <div class="carousel-caption">

                    <h2>🍕 Buy 1 Get 1 Free</h2>

                    <p>Available on selected pizzas</p>

                    <button class="btn btn-warning">
                        View Offer
                    </button>

                </div>

            </div>

        </div>

        <!-- Controls -->

        <button class="carousel-control-prev"
            type="button"
            data-bs-target="#offerCarousel"
            data-bs-slide="prev">

            <span class="carousel-control-prev-icon"></span>

        </button>

        <button class="carousel-control-next"
            type="button"
            data-bs-target="#offerCarousel"
            data-bs-slide="next">

            <span class="carousel-control-next-icon"></span>

        </button>

    </div>

</section>
